<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pruebas de Algoritmos Dijkstra</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border-radius: 8px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .header h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
      line-height: 1.6;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .panel {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .panel h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 18px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      color: #555;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
      font-family: "Courier New", monospace;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .btn-secondary {
      background: #e0e7ff;
      color: #667eea;
    }

    .btn-secondary:hover {
      background: #c7d2fc;
    }

    .mode-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .mode-btn {
      padding: 10px;
      border: 2px solid #ddd;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #666;
      transition: all 0.3s ease;
    }

    .mode-btn.active {
      border-color: #667eea;
      background: #667eea;
      color: white;
    }

    .mode-btn:hover {
      border-color: #667eea;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .result-card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .result-card.distancia {
      border-top: 4px solid #f59e0b;
    }

    .result-card.costo {
      border-top: 4px solid #10b981;
    }

    .result-card.tiempo {
      border-top: 4px solid #6366f1;
    }

    .result-card h3 {
      color: #333;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .result-body {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    .result-value {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .result-value:last-child {
      border-bottom: none;
    }

    .result-label {
      font-weight: 500;
      color: #555;
    }

    .result-data {
      color: #667eea;
      font-weight: 600;
    }

    .path {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      font-family: "Courier New", monospace;
      font-size: 12px;
      overflow-x: auto;
      word-break: break-all;
    }

    .error-message {
      background: #fee;
      color: #c33;
      padding: 10px 12px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 14px;
    }

    .success-message {
      background: #efe;
      color: #3c3;
      padding: 10px 12px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 14px;
    }

    .loading {
      display: inline-block;
      width: 4px;
      height: 4px;
      background: #667eea;
      border-radius: 50%;
      margin-right: 4px;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .loading:nth-child(2) {
      animation-delay: -0.2s;
    }

    .loading:nth-child(3) {
      animation-delay: -0.4s;
    }

    @keyframes bounce {
      0%,
      80%,
      100% {
        opacity: 0.3;
        transform: translateY(0);
      }

      40% {
        opacity: 1;
        transform: translateY(-8px);
      }
    }

    .status {
      padding: 10px 12px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 13px;
      background: #f0f4ff;
      color: #667eea;
    }

    @media (max-width: 768px) {
      .content,
      .results {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>🧪 Pruebas de Algoritmos Dijkstra</h1>
      <p>
        Carga un archivo JSON de grafo y prueba los tres algoritmos de búsqueda:
        <strong>Distancia Mínima</strong>, <strong>Costo Mínimo</strong> y
        <strong>Tiempo Mínimo</strong>. Compara los resultados en tiempo real.
      </p>
    </div>

    <div class="content">
      <div class="panel">
        <h2>📁 Cargar Grafo</h2>
        <div class="form-group">
          <label for="file-input">Archivo JSON:</label>
          <input id="file-input" type="file" accept=".json,application/json" />
          <div id="file-status" class="status"></div>
        </div>
      </div>

      <div class="panel">
        <h2>🔍 Parámetros de Búsqueda</h2>
        <div class="form-group">
          <label>Modo(s) a probar:</label>
          <div class="mode-selector">
            <button class="mode-btn active" data-mode="distancia">📏 Distancia</button>
            <button class="mode-btn active" data-mode="costo">💰 Costo</button>
            <button class="mode-btn active" data-mode="tiempo">⏱️ Tiempo</button>
          </div>
        </div>
        <div class="form-group">
          <label for="origin-id">ID Nodo Origen:</label>
          <input id="origin-id" type="text" placeholder="Ej: node1" />
        </div>
        <div class="form-group">
          <label for="destination-id">ID Nodo Destino:</label>
          <input id="destination-id" type="text" placeholder="Ej: node5" />
        </div>
        <div class="form-group">
          <label for="budget">Presupuesto (USD, opcional):</label>
          <input id="budget" type="number" step="0.01" min="0" placeholder="Ej: 5000" />
        </div>
        <div class="button-group">
          <button class="btn-primary" id="run-tests">▶️ Ejecutar Pruebas</button>
          <button class="btn-secondary" id="clear-results">🗑️ Limpiar</button>
        </div>
      </div>
    </div>

    <div id="results-container" class="results"></div>

    <div class="panel">
      <h2>📊 Respuesta JSON</h2>
      <div class="form-group">
        <textarea id="json-response" readonly placeholder="La respuesta JSON aparecerá aquí..."></textarea>
      </div>
    </div>
  </div>

  <script>
    let currentGraph = null;
    const selectedModes = new Set(["distancia", "costo", "tiempo"]);

    // Event: File input
    document.getElementById("file-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        currentGraph = JSON.parse(text);
        document.getElementById("file-status").innerHTML = `<div class="success-message">✓ Archivo cargado: ${file.name} (${currentGraph.nodos?.length || 0} nodos, ${currentGraph.aristas?.length || 0} aristas)</div>`;
      } catch (error) {
        document.getElementById("file-status").innerHTML = `<div class="error-message">✗ Error: ${error.message}</div>`;
      }
    });

    // Event: Mode selector
    document.querySelectorAll(".mode-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const mode = btn.dataset.mode;
        btn.classList.toggle("active");
        if (btn.classList.contains("active")) {
          selectedModes.add(mode);
        } else {
          selectedModes.delete(mode);
        }
      });
    });

    // Event: Run tests
    document.getElementById("run-tests").addEventListener("click", runTests);
    document.getElementById("clear-results").addEventListener("click", clearResults);

    async function runTests() {
      if (!currentGraph) {
        alert("Por favor carga un archivo JSON primero.");
        return;
      }

      const originId = document.getElementById("origin-id").value.trim();
      const destId = document.getElementById("destination-id").value.trim();
      const budget = parseFloat(document.getElementById("budget").value) || null;

      if (!originId || !destId) {
        alert("Ingresa ID de origen y destino.");
        return;
      }

      const resultsContainer = document.getElementById("results-container");
      resultsContainer.innerHTML = "";

      const modes = Array.from(selectedModes);
      if (modes.length === 0) {
        alert("Selecciona al menos un modo de búsqueda.");
        return;
      }

      for (const mode of modes) {
        const card = document.createElement("div");
        card.className = `result-card ${mode}`;
        card.innerHTML = `
          <h3>${getModeLabel(mode)}</h3>
          <div class="result-body">
            <div class="status">
              <span class="loading"></span>
              <span class="loading"></span>
              <span class="loading"></span>
              Procesando...
            </div>
          </div>
        `;
        resultsContainer.appendChild(card);

        try {
          const payload = {
            graph: currentGraph,
            inicioId: originId,
            destinoId: destId,
            modo: mode,
            presupuestoTotal: budget,
            opciones: {
              aeronaves: [],
              incluirAlojamiento: true,
              incluirAlimentacion: true,
              incluirTrabajo: true,
            },
          };

          const response = await fetch("/api/route", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const data = await response.json();
          document.getElementById("json-response").value =
            JSON.stringify(data, null, 2);

          renderResult(card, data, mode);
        } catch (error) {
          card.innerHTML = `
            <h3>${getModeLabel(mode)}</h3>
            <div class="result-body">
              <div class="error-message">Error: ${error.message}</div>
            </div>
          `;
        }
      }
    }

    function renderResult(card, data, mode) {
      if (!data.encontrado) {
        card.innerHTML = `
          <h3>${getModeLabel(mode)}</h3>
          <div class="result-body">
            <div class="error-message">${data.error || "Ruta no encontrada"}</div>
          </div>
        `;
        return;
      }

      let content = `<h3>${getModeLabel(mode)}</h3><div class="result-body">`;

      if (mode === "distancia") {
        content += `
          <div class="result-value">
            <span class="result-label">Distancia total:</span>
            <span class="result-data">${(data.totalKm || 0).toFixed(2)} km</span>
          </div>
        `;
      } else if (mode === "costo") {
        content += `
          <div class="result-value">
            <span class="result-label">Costo total:</span>
            <span class="result-data">$${(data.totalCosto || 0).toFixed(2)}</span>
          </div>
          <div class="result-value">
            <span class="result-label">Distancia:</span>
            <span class="result-data">${(data.totalKm || 0).toFixed(2)} km</span>
          </div>
        `;
      } else if (mode === "tiempo") {
        content += `
          <div class="result-value">
            <span class="result-label">Tiempo total:</span>
            <span class="result-data">${(data.totalCosto || 0).toFixed(2)} horas</span>
          </div>
          <div class="result-value">
            <span class="result-label">Distancia:</span>
            <span class="result-data">${(data.totalKm || 0).toFixed(2)} km</span>
          </div>
        `;
      }

      content += `
        <div class="result-value">
          <span class="result-label">Pasos:</span>
          <span class="result-data">${(data.pasos || []).length}</span>
        </div>
        <div class="path">
          <strong>Camino:</strong> ${(data.camino || []).join(" → ")}
        </div>
      `;

      content += "</div>";
      card.innerHTML = content;
    }

    function getModeLabel(mode) {
      const labels = {
        distancia: "📏 Distancia Mínima",
        costo: "💰 Costo Mínimo",
        tiempo: "⏱️ Tiempo Mínimo",
      };
      return labels[mode] || mode;
    }

    function clearResults() {
      document.getElementById("results-container").innerHTML = "";
      document.getElementById("json-response").value = "";
    }
  </script>
</body>

</html>
